name: Config Probe (fast, no build)

# 目的：只跑配置阶段（约 8-12 分钟），定位 vendor defconfig 里的
# 110 行 CONFIG_MTK_WIFI7_* 在哪一步被 make defconfig 丢弃。
# 这些符号一旦丢失，CONFIG_MT_WIFI 为空 -> mt_wifi_ap/Makefile 的
# obj-$(CONFIG_MT_WIFI) 不展开 -> 不生成 mt_wifi.ko -> 3 小时后报
# "ERROR: module .../mt_wifi.ko is missing."

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up minimal build environment
        run: |
          sudo apt update -y
          sudo apt install -y build-essential bison flex git gawk gettext \
            libncurses-dev libssl-dev python3 python3-pyelftools rsync unzip \
            wget curl zlib1g-dev bc rsync
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth=1 --branch mt798x-mt799x-6.6-mtwifi \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6.git immortalwrt

      - name: P1 - raw defconfig file
        working-directory: immortalwrt
        run: |
          cp -f defconfig/mt7987_mt7992.config .config
          echo "P1 defconfig文件内 CONFIG_MTK_WIFI7_ 行数: $(grep -c '^CONFIG_MTK_WIFI7_' .config || true)"
          echo "P1 CONFIG_PACKAGE_kmod-mt_wifi7: $(grep '^CONFIG_PACKAGE_kmod-mt_wifi7=' .config || echo 缺失)"

      - name: P2 - after first make defconfig
        working-directory: immortalwrt
        run: |
          make defconfig > /tmp/defconfig1.log 2>&1 || true
          echo "P2 make defconfig 后 CONFIG_MTK_WIFI7_ 行数: $(grep -c '^CONFIG_MTK_WIFI7_' .config || true)"
          echo "P2 关键符号:"
          grep -E '^CONFIG_MTK_WIFI7_(MT_WIFI|MT_AP_SUPPORT|FIRST_IF_MT7992|FIRST_IF_NONE|CHIP_MT7992|SKU_TYPE)=' .config || echo "  (全部缺失!)"
          echo "P2 CONFIG_PACKAGE_kmod-mt_wifi7: $(grep '^CONFIG_PACKAGE_kmod-mt_wifi7=' .config || echo 缺失)"
          echo "--- defconfig 日志尾部 ---"
          tail -20 /tmp/defconfig1.log || true

      - name: P3 - feeds install
        working-directory: immortalwrt
        run: |
          if [ -f ../diy-part1.sh ]; then bash ../diy-part1.sh; fi
          ./scripts/feeds update -a > /tmp/feeds.log 2>&1
          ./scripts/feeds install -a >> /tmp/feeds.log 2>&1
          echo "P3 feeds 后 CONFIG_MTK_WIFI7_ 行数: $(grep -c '^CONFIG_MTK_WIFI7_' .config || true)"

      - name: P4 - after seed + second make defconfig
        working-directory: immortalwrt
        run: |
          if [ -f ../configs/c2000max-packages.seed ]; then cat ../configs/c2000max-packages.seed >> .config; fi
          make defconfig > /tmp/defconfig2.log 2>&1 || true
          echo "P4 make defconfig 后 CONFIG_MTK_WIFI7_ 行数: $(grep -c '^CONFIG_MTK_WIFI7_' .config || true)"
          echo "P4 CONFIG_PACKAGE_kmod-mt_wifi7: $(grep '^CONFIG_PACKAGE_kmod-mt_wifi7=' .config || echo 缺失)"
          grep -E '^CONFIG_MTK_WIFI7_(MT_WIFI|MT_AP_SUPPORT|FIRST_IF_MT7992|FIRST_IF_NONE|CHIP_MT7992|SKU_TYPE)=' .config || echo "  (全部缺失!)"

      - name: P5 - try to re-inject vendor MTK_WIFI7 block
        working-directory: immortalwrt
        run: |
          grep '^CONFIG_MTK_WIFI7_' defconfig/mt7987_mt7992.config >> .config
          make defconfig > /tmp/defconfig3.log 2>&1 || true
          echo "P5 重注入 + defconfig 后 CONFIG_MTK_WIFI7_ 行数: $(grep -c '^CONFIG_MTK_WIFI7_' .config || true)"
          grep -E '^CONFIG_MTK_WIFI7_(MT_WIFI|MT_AP_SUPPORT|FIRST_IF_MT7992|CHIP_MT7992|SKU_TYPE)=' .config || echo "  (重注入无效!)"

      - name: Summary
        run: |
          {
            echo "## MTK_WIFI7 kconfig probe"
            echo ""
            echo "vendor defconfig 里的 MTK_WIFI7 行数: $(grep -c '^CONFIG_MTK_WIFI7_' immortalwrt/defconfig/mt7987_mt7992.config || true)"
            echo ""
            echo '最终 .config 里的关键符号:'
            echo '```'
            grep -E '^CONFIG_MTK_WIFI7_(MT_WIFI|MT_AP_SUPPORT|FIRST_IF_MT7992|FIRST_IF_NONE|CHIP_MT7992|SKU_TYPE)=' immortalwrt/.config || echo "(关键符号缺失)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
